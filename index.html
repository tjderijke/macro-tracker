<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Macro's</title>
  <meta name="description" content="Persoonlijke voedings- en gewichtstracker">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Macro's">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Hoofdmenu">
      <a href="#vandaag" data-view="vandaag">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><path d="M8.5 14.5l2.2 2.2 4.8-4.8"/></svg>
        <span>Vandaag</span>
      </a>
      <a href="#bibliotheek" data-view="bibliotheek">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h4.5v15H5zM9.5 4.5H14v15H9.5z"/><path d="M15.2 5.6l3.9-1 3.6 14.1-3.9 1z"/></svg>
        <span>Bibliotheek</span>
      </a>
      <a href="#gewicht" data-view="gewicht">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M7.2 11a5.3 5.3 0 0 1 9.6 0z"/><path d="M12 10.6l1.6-2.4"/></svg>
        <span>Gewicht</span>
      </a>
      <a href="#instellingen" data-view="instellingen">
        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
        <span>Instellingen</span>
      </a>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-head"></div>
    <div class="sheet-body"></div>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
